# Builds the Flutter phone app in mobile/ on GitHub's computers:
# an Android APK you can install, and the web version of the app.
# The Supabase address and public key come from the repository's
# Actions secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (never from code).
# Without them the app still builds and shows sample data only.
name: Mobile app

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          # Same Flutter version the app was written and tested with.
          flutter-version: "3.38.0"
          channel: stable
          cache: true
      - name: Write build settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf '{"SUPABASE_URL":"%s","SUPABASE_PUBLISHABLE_KEY":"%s"}' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > env.json
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK
        run: flutter build apk --release --dart-define-from-file=env.json
      - uses: actions/upload-artifact@v4
        with:
          name: pitchproof-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Build web version
        run: flutter build web --release --no-web-resources-cdn --dart-define-from-file=env.json
      - uses: actions/upload-artifact@v4
        with:
          name: pitchproof-web
          path: mobile/build/web
